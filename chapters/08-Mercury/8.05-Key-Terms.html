<h2>Mercury Key Terms</h2>

<ul>
    <li><a id="Doppler+effect" name="Doppler+effect"><strong>Doppler effect</strong></a>: the apparent change in wavelength or frequency of the radiation from a source due to its relative motion away from or toward the observer</li>
    <li><a id="scarp" name="scarp"><strong>scarp</strong></a>: a geologic structure with a very steep or vertical slope, such as a cliff</li>
</ul>
