        - article [ref=f2e47]:
          - heading "What is life, really? A case for interdisciplinary science" [level=1] [ref=f2e48]
          - paragraph [ref=f2e49]:
            - text: by
            - link "Flavia Pascal" [ref=f2e50] [cursor=pointer]:
              - /url: https://astrobites.org/author/fpascal/
            - text: "| Jul 6, 2026 |"
            - link "Beyond" [ref=f2e51] [cursor=pointer]:
              - /url: https://astrobites.org/category/beyond/
            - text: "|"
            - link "0 comments" [ref=f2e53] [cursor=pointer]:
              - /url: https://astrobites.org/2026/07/06/case-for-interdisciplinary-science/#respond
          - generic [ref=f2e54]:
            - paragraph [ref=f2e55]:
              - emphasis [ref=f2e56]:
                - strong [ref=f2e57]: “Wait… so when you say ‘life’, do you mean like… aliens?”
            - paragraph [ref=f2e58]:
              - emphasis [ref=f2e59]:
                - strong [ref=f2e60]: “Not exactly…”
            - paragraph [ref=f2e61]:
              - emphasis [ref=f2e62]:
                - strong [ref=f2e63]: “So… no aliens???”
            - paragraph [ref=f2e64]:
              - emphasis [ref=f2e65]:
                - strong [ref=f2e66]: “Not necessarily…”
            - paragraph [ref=f2e67]:
              - strong [ref=f2e68]: “Right…”
            - paragraph [ref=f2e69]:
              - emphasis [ref=f2e70]:
                - text: This Astrobite may or may not have been inspired by a real conversation I had while watching “Project Hail Mary” as a student working in exoplanets, trying to explain what I actually do on a daily basis. Somewhere between describing atmospheric spectra, habitability metrics, and why “
                - strong [ref=f2e71]: we haven’t found life yet
                - text: ” is not the same as “
                - strong [ref=f2e72]: there is nothing out there
                - text: “, I realised how quickly even a simple question like “
                - strong [ref=f2e73]: what is life?”
                - text: can turn into immediate confusion.
            - heading [level=3] [ref=f2e74]:
              - strong [ref=f2e75]:
                - emphasis [ref=f2e76]: Aliens
                - text: ", interdisciplinary science, and the world’s most confusing group chat"
            - paragraph [ref=f2e77]:
              - text: In Andy Weir’s
              - link [ref=f2e78] [cursor=pointer]:
                - /url: https://astrobites.org/2026/04/24/fthe-space-odyssey-and-the-space-mission/
                - emphasis [ref=f2e79]: Project Hail Mary
              - text: ", humanity faces an existential crisis. The solution ultimately depends on an unlikely partnership between Ryland Grace, a human scientist, and Rocky, an “alien” engineer from an entirely different planet. Unfortunately, neither of them speaks the other’s language. Or sees the same way. Or hears the same way. Or, for a while, even understands what the other is. Before they can save their planets, Ryland Grace and Rocky must solve a problem familiar to anyone who has attended an interdisciplinary conference: figuring out what on Earth — or"
              - emphasis [ref=f2e80]: off Earth
              - text: "— the other person is talking about. Yet through persistence, curiosity, and a remarkable tolerance for confusion, they gradually build a shared language and discover that collaboration can mend even interstellar differences. As Rocky would say:"
              - emphasis [ref=f2e81]: amaze, amaze, amaze!
            - paragraph [ref=f2e82]:
              - text: What made
              - emphasis [ref=f2e83]: Project Hail Mary
              - text: "so memorable for me is not only the interstellar travel, exotic astrophysics, or the fact that Rocky is arguably the best engineer in fiction, but the lesson hidden behind it: scientific progress often depends on collaboration across profound differences."
            - paragraph [ref=f2e84]:
              - text: Fortunately, scientists do not need (yet?) to communicate with aliens but they are part of a group chat where everyone speaks different scientific languages, use different methodologies, and occasionally use the same words to mean completely different things (even something as simple as typing “
              - link "metallicity" [ref=f2e85] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metallicity
              - text: ” can cause the group chat to split into different threads!).
            - heading [level=3] [ref=f2e86]:
              - strong [ref=f2e87]:
                - strong [ref=f2e88]: The group chat is getting crowded
            - paragraph [ref=f2e89]: "I enter this group chat as a budding exoplanet researcher. In astronomy, life is often associated with discovering planets, observing atmospheres, and searching for signs of life. Yet before we can determine whether a distant world hosts life, we first run into a tough question: what is life, exactly? A wall — and a very “rocky” one at that — for every discipline involved."
            - paragraph [ref=f2e90]: Despite centuries of scientific progress, there is still no universally accepted definition. We can usually agree that a cat is alive and a rock is not, but the edge cases quickly become confusing. Bacteria? Self-replicating molecules? Aliens? Ask a group of scientists, and you may get enough answers to start a second group chat and a debate in both.
            - paragraph [ref=f2e92]:
              - text: "The reason is simple: no single discipline owns the question and none is sufficient to solve it alone. Biologists study living organisms. Chemists investigate the reactions that may have produced life’s building blocks. Geologists study the environments of early Earth. Oceanographers explore the deep-sea organisms that may have hosted the first metabolic processes leading to life as we know it. Computer scientists build models of complex, self-organizing systems. And astronomers ask the dangerous follow-up question: if life emerged here, can we"
              - link "detect" [ref=f2e93] [cursor=pointer]:
                - /url: https://astrobites.org/2023/08/19/signs-of-pre-life-jwst/
              - text: it elsewhere? In other words, the search for life’s origins resembles a scientific version of
              - emphasis [ref=f2e94]: Project Hail Mary
              - text: . Everyone is trying to solve the same problem, but each field comes with its own vocabulary, assumptions, and favorite way of showing off plots.
            - 'figure "Figure 1: Different approaches to investigating the origins of life, spanning laboratory studies of prebiotic chemistry, experimental and synthetic biology, analyses of early Earth and extraterrestrial environments, studies of extremophiles and biological evolution, artificial life systems, and computational models of living systems. Adapted from Figure 1 in this paper." [ref=f2e96]':
              - link [ref=f2e97] [cursor=pointer]:
                - /url: https://royalsocietypublishing.org/rstb/article/380/1936/20240281/235158/Origins-of-life-the-possible-and-the-actualOrigins
              - generic [ref=f2e98]:
                - strong [ref=f2e99]: "Figure 1:"
                - text: Different approaches to investigating the origins of life, spanning laboratory studies of prebiotic chemistry, experimental and synthetic biology, analyses of early Earth and extraterrestrial environments, studies of extremophiles and biological evolution, artificial life systems, and computational models of living systems.
                - emphasis [ref=f2e100]:
                  - text: Adapted from Figure 1 in this
                  - link "paper" [ref=f2e101] [cursor=pointer]:
                    - /url: https://royalsocietypublishing.org/rstb/article/380/1936/20240281/235158/Origins-of-life-the-possible-and-the-actualOrigins
                  - text: .
            - paragraph [ref=f2e102]:
              - text: This challenge in the origins of life research has led to increasing calls for
              - link "interdisciplinarity" [ref=f2e103] [cursor=pointer]:
                - /url: https://astrobites.org/2015/10/07/more-than-astronomy-astrophysics/
              - text: between astronomy, physics, chemistry, biology, geology, and many other fields (as highlighted in a recent
              - link "issue" [ref=f2e104] [cursor=pointer]:
                - /url: https://www.sciencedirect.com/science/article/pii/S2666386426001268
              - text: of
              - emphasis [ref=f2e105]: Cell Reports Physical Science
              - text: ). In this context, interdisciplinarity is not merely a matter of convenience but a necessity, because the problem itself forces us to think across an extraordinary range of scales, both in space and in time. On one hand, we must zoom in and ask question at scales measured in nanometers and microseconds, where chemistry and physics take center stage. We want to understand how individual atoms assembled into molecules, how those molecules interacted, and how chemistry gradually became successful enough to sustain processes we might call “living”. On the other hand, we must simultaneously zoom out, asking questions spanning hundreds of light years and hundreds of millions of years. The environments that hosted these successful reactions were shaped by complex factors like planetary geology, ocean chemistry, atmospheric evolution, and even astronomical processes occurring long before Earth formed. Connecting these vastly different scales is what humans are only beginning to do and we are still far from fully bridging the gap between them.
            - heading [level=3] [ref=f2e106]:
              - strong [ref=f2e107]: Many fields, many puzzle pieces…
            - paragraph [ref=f2e108]:
              - text: Many previous Astrobites have explored individual pieces of the origins of life puzzle. Some have discussed
              - link "giant impacts" [ref=f2e109] [cursor=pointer]:
                - /url: https://astrobites.org/2022/04/19/how-a-moon-sized-deep-impact-affected-early-life-on-earth/
              - text: capable of temporarily altering Earth’s atmosphere to create favorable conditions for
              - link "prebiotic" [ref=f2e110] [cursor=pointer]:
                - /url: https://astrobites.org/2023/03/04/lab-biosignatures/
              - text: chemistry. Others investigated the delivery of life’s ingredients by
              - link "comets" [ref=f2e111] [cursor=pointer]:
                - /url: https://astrobites.org/2025/02/15/its-raining-molecules-but-planets-around-m-dwarfs-may-want-to-hold-their-hallelujah/
              - text: ","
              - link "meteorites" [ref=f2e112] [cursor=pointer]:
                - /url: https://astrobites.org/2015/06/26/natures-starships-vol-i-ride-in-on-shooting-stars/
              - text: ", and"
              - link "cosmic dust" [ref=f2e113] [cursor=pointer]:
                - /url: https://astrobites.org/2026/05/11/template-post-38/
              - text: . Some have looked at how complex organic molecules may form in
              - link "interstellar dust grains" [ref=f2e114] [cursor=pointer]:
                - /url: https://astrobites.org/2021/07/14/template-post-2-2-2-2-3/
              - text: and in
              - link "molecular clouds" [ref=f2e115] [cursor=pointer]:
                - /url: https://astrobites.org/2020/10/26/template-post-2-2-2-2/
              - text: long before planets even exist, while others have talked about how
              - link "dust and plasma interactions" [ref=f2e116] [cursor=pointer]:
                - /url: https://astrobites.org/2013/11/29/prebiotic-skies/
              - text: may drive the formation of prebiotic compounds. Beyond natural settings, researchers have also turned to controlled
              - link "laboratory experiments" [ref=f2e117] [cursor=pointer]:
                - /url: https://astrobites.org/2023/03/04/lab-biosignatures/
              - text: that attempt to recreate plausible pathways from simple molecules to the building blocks of life.
            - paragraph [ref=f2e118]:
              - text: Overall, observational and theoretical work so far spans a wide range of environments where life might emerge or be detected, from
              - link "hydrothermal vents" [ref=f2e119] [cursor=pointer]:
                - /url: https://astrobites.org/2011/04/23/astrobiology-seeking-out-the-origin-of-life-new-life-and-new-civilizations/
              - text: on Earth’s ocean floor to
              - link "planetary atmospheres" [ref=f2e120] [cursor=pointer]:
                - /url: https://astrobites.org/2023/08/19/signs-of-pre-life-jwst/
              - text: and distant exoplanets. So while all these puzzle pieces are interesting in themselves, the real fun begins when we try to actually connect them.
            - heading [level=3] [ref=f2e121]:
              - strong [ref=f2e122]: Earth is our guide… but also our limitation
            - paragraph [ref=f2e123]: "In astronomy, a lot of effort in the search for life naturally focuses on what we can observe from afar: potentially habitable planets, atmospheric signatures, and conditions that look familiar. This is a very reasonable starting point as we tend to look for worlds that resemble the only example of life we actually know: Earth. That brings with it a long list of assumptions, sometimes explicit, sometimes unspoken. Temperatures around 300 Kelvin? Great. Liquid water? Even better. Amino acids as building blocks, DNA as the preferred information storage system, combusting sugars in the presence of oxygen as a good energy source. Life is, however, under no obligation to be Earth-like. So if astronomy is going to move beyond the hunt for Earth 2.0, it cannot just assume biology’s answers in advance. And similarly, biology and prebiotic chemistry cannot ignore the environments that astronomy tells us actually exist out there. It turns out these puzzle pieces need each other: astronomy constrains where biology and chemistry happen, while biology and chemistry tell us what kinds of pathways are even plausible in those environments."
            - heading [level=3] [ref=f2e124]:
              - strong [ref=f2e125]: What planets produce is not always what life prefers
            - paragraph [ref=f2e126]:
              - text: "But in assuming these puzzle pieces are compatible, we are implicitly assuming that planetary chemistry naturally produces the kinds of molecular building blocks that biology tends to rely on, which is far from guaranteed. This is where a more fundamental mismatch appears between geochemistry and biochemistry, specifically in the chemical forms nitrogen and carbon tend to take. From a geochemical perspective, these elements are often found in what you might call their “final states”: nitrogen as N"
              - subscript [ref=f2e127]: ₂
              - text: and carbon as CO₂. On Earth, for example, nitrogen dominates the atmosphere as
              - link [ref=f2e128] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nitrogen_cycle
                - text: "N"
                - subscript [ref=f2e129]: ₂
              - text: ", while carbon released through processes such as respiration, decomposition, and volcanism commonly accumulates as"
              - link "CO₂" [ref=f2e130] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Carbon_cycle
              - text: in the atmosphere and oceans. These are highly stable forms, basically where the elements end up after they have been thoroughly processed by a planet’s chemistry and are not particularly eager to change further. From a biochemical perspective, however, life as we know it tends to work with very different forms of molecules. It makes heavy use of compounds like NH₃, HCN, and CH₂O, where nitrogen and carbon remain in more chemically “open” states and can more readily participate in further reactions and serve as building blocks for more complex organic chemistry.
            - paragraph [ref=f2e131]: So, while geochemistry tends to favor carbon and nitrogen in their “parking mode”, biochemistry relies on forms that are still in “driving mode”. This tension is not a contradiction but an invitation to a group chat discussion. Assessing the habitability of distant planets from astronomical observations requires understanding not only whether the necessary ingredients are present, but also whether geochemical planetary processes can continually supply them in biochemically useful forms. Geochemists can help map how and where a planet naturally produces — or fails to produce — these useful compounds. Biologists can then explore how such building blocks might be assembled into increasingly complex systems. Last but not least, astronomers can determine which planetary environments actually exist and where such biochemistry may be possible.
            - paragraph [ref=f2e132]:
              - text: A hot topic of discussion between geochemists, biologists, and astronomers is the role of HCN as a potential building block for life. If HCN is produced in a planet’s atmosphere (something that can happen under the influence of stellar radiation and is actively studied by astronomers) it can dissolve in liquid water and form CN
              - superscript [ref=f2e133]: −
              - text: . The exact conditions under which this transformation occurs are studied by geochemists. From there, CN
              - superscript [ref=f2e134]: −
              - text: can take part in a variety of reactions that slowly build up chemical complexity. Over time, this can lead to more complex carbon-based compounds, including molecules that are relevant for prebiotic chemistry, which in turn inform biological hypotheses about the emergence of life.
            - heading [level=3] [ref=f2e135]:
              - strong [ref=f2e136]: There is hope in interdisciplinary collaboration
            - paragraph [ref=f2e137]:
              - text: The HCN example is just one of many ways different disciplines can work together to address the origins of life problem, or at least get a bit closer to understanding how it might actually work. If
              - emphasis [ref=f2e138]: Project Hail Mary
              - text: teaches us anything, it is that remarkable things happen when people who do not initially understand one another decide the problem is worth solving together. We need astronomers who are curious about chemistry, chemists who think about planets, biologists who are willing to talk to physicists, and perhaps most importantly, people who are comfortable standing at the boundaries between fields. We need you, too — yes, you, the reader — to be part of that conversation.
            - paragraph [ref=f2e139]:
              - emphasis [ref=f2e140]: Astrobite edited by
              - emphasis [ref=f2e141]: Shalini Kurinchi-Vendhan
            - paragraph [ref=f2e142]:
              - emphasis [ref=f2e143]: "Featured image credit: Artistic impression of a sunset seen from the super-Earth Gliese 667 Cc, credited to ESO/L. Calçada, licensed under CC BY 4.0."
